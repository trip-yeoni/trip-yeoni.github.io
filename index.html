<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="연인·가족·아이와 떠나는 힐링 숙소 리스트 | 여니">
<title>여니 숙소 리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* 레이아웃: 폰 한 화면 폭의 단일 칼럼 — 프로필 → 검색 → 번호 숙소 카드 목록 */
:root{
  --bg:#eef2f1; --card:#ffffff; --fg:#1f2a2c; --muted:#5f6d6f; --line:#d5dedc;
  --accent:#2f6f73; --accent-soft:#dcebea; --warm:#c8743e;
  --display:"Gowun Batang","Noto Serif KR",serif; --body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b1c; --card:#1d2627; --fg:#e7eeec; --muted:#9aa9a7; --line:#2d3a3b;
  --accent:#7cc0c2; --accent-soft:#233738; --warm:#e09a63; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b1c; --card:#1d2627; --fg:#e7eeec; --muted:#9aa9a7; --line:#2d3a3b;
  --accent:#7cc0c2; --accent-soft:#233738; --warm:#e09a63; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:22px}
.notice{background:var(--accent-soft);color:var(--fg);font-size:12.5px;text-align:center;padding:9px 14px;border-radius:10px}
header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
h1{font-family:var(--display);font-size:24px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em}
.handle{color:var(--muted);font-size:13px;margin:0}
.bio{margin:2px 0 0;font-size:14px;color:var(--fg);text-wrap:balance}
.how{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--muted)}
.how b{color:var(--fg)}
.search{position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:13px 14px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;scroll-margin-top:20px}
.item.hit{box-shadow:0 0 0 2px var(--accent)}
.thumb{width:84px;height:84px;border-radius:11px;object-fit:cover;display:block}
.meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.no{font-family:var(--display);font-weight:700;color:var(--warm);font-size:14px;font-variant-numeric:tabular-nums}
.name{font-weight:700;font-size:15.5px;margin:0;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}
.go{justify-self:start;font-size:13px;font-weight:700;color:#fff;background:var(--accent);padding:7px 12px;border-radius:9px;text-decoration:none}
.go:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
:root:not([data-theme="light"]) .go{color:var(--bg)}
.soon{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 0}
footer{text-align:center;color:var(--muted);font-size:12px}
</style>
</head>

const list = document.getElementById('list'), q = document.getElementById('q'), empty = document.getElementById('empty');
document.getElementById('notice').hidden = !AFFILIATE;
function render(){
  const s = q.value.trim().replace(/[\[\]#번]/g,'');
  const rows = STAYS.slice().sort((a,b)=>b.no-a.no).filter(x=>!s || String(x.no)===s || x.name.includes(s) || x.tags.some(t=>t.includes(s)));
  list.replaceChildren(...rows.map(x=>{
    const li=document.createElement('li'); li.className='item'; li.id=String(x.no);
    const im=document.createElement('img'); im.className='thumb'; im.src=x.img; im.alt=''; im.loading='lazy';
    const m=document.createElement('div'); m.className='meta';
    const no=document.createElement('span'); no.className='no'; no.textContent='['+x.no+']';
    const n=document.createElement('p'); n.className='name'; n.textContent=x.name;
    const tg=document.createElement('div'); tg.className='tags';
    x.tags.forEach(t=>{const sp=document.createElement('span'); sp.className='tag'; sp.textContent=t; tg.append(sp)});
    m.append(no,n,tg);
    if(x.url){const a=document.createElement('a'); a.className='go'; a.href=x.url; a.target='_blank'; a.rel='noopener'; a.textContent='숙소 보러가기'; m.append(a);}
    else{const p=document.createElement('span'); p.className='soon'; p.textContent='링크 준비 중 · 댓글 남기면 DM으로 알려드려요'; m.append(p);}
    li.append(im,m); return li;
  }));
  empty.hidden = rows.length>0;
}
q.addEventListener('input',render);
render();
const h=location.hash.slice(1);
if(/^\d+$/.test(h)){const el=document.getElementById(h); if(el){el.classList.add('hit'); el.scrollIntoView({block:'center'});}}
